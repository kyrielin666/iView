spring:
  application:
    name: iview
  datasource:
    url: ${JDBC_URL:jdbc:h2:file:./data/iview;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${JDBC_USERNAME:sa}
    password: ${JDBC_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: iView
    description: Industrial data and visualization platform

iview:
  cors:
    # 逗号分隔的前端来源；留空即不开启跨域，开发期通过 iView-frontend/server.mjs 同源代理。
    allowed-origins: ${IVIEW_CORS_ALLOWED_ORIGINS:}
  data-source:
    # 开发默认值；生产环境必须通过 IVIEW_DATASOURCE_SECRET 覆盖，且不得变更已有值。
    secret: ${IVIEW_DATASOURCE_SECRET:iview-development-secret-change-me}
  data-sources:
    file-root: ${IVIEW_FILE_SOURCE_ROOT:./data/file-sources}
    # 默认拦截回环、链路本地和内网 HTTP 地址，可信工业内网部署需显式开启。
    http:
      allow-private: ${IVIEW_HTTP_ALLOW_PRIVATE:false}
  auth:
    # 开发默认账号仅用于首次空库启动；生产环境必须通过环境变量覆盖这两个值。
    token-secret: ${IVIEW_AUTH_TOKEN_SECRET:iview-development-token-secret-change-me}
    bootstrap-admin-password: ${IVIEW_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  backup:
    directory: ${IVIEW_BACKUP_DIRECTORY:./data/backups}
    retention-count: ${IVIEW_BACKUP_RETENTION_COUNT:7}
    # 恢复会重建整个数据库，只能在维护窗口明确启用。
    restore-enabled: ${IVIEW_BACKUP_RESTORE_ENABLED:false}
    postgres:
      # PostgreSQL 备份默认关闭；启用后需要在 PATH 中提供 pg_dump 和 pg_restore，或指定完整命令路径。
      enabled: ${IVIEW_BACKUP_POSTGRES_ENABLED:false}
      pg-dump-command: ${IVIEW_BACKUP_POSTGRES_PG_DUMP_COMMAND:pg_dump}
      pg-restore-command: ${IVIEW_BACKUP_POSTGRES_PG_RESTORE_COMMAND:pg_restore}
      command-timeout-seconds: ${IVIEW_BACKUP_POSTGRES_COMMAND_TIMEOUT_SECONDS:1800}
  collector:
    scheduling-enabled: false
    scan-delay-ms: 1000
