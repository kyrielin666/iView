spring:
  application:
    name: iview
  datasource:
    url: ${JDBC_URL:jdbc:h2:file:./data/iview;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${JDBC_USERNAME:sa}
    password: ${JDBC_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: iView
    description: Industrial data and visualization platform

iview:
  collector:
    scheduling-enabled: false
    scan-delay-ms: 1000
